[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmjudge"
version = "1.0.0"
description = "Self-hosted LLM evaluation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "psycopg[binary]",
    "arq",
    "redis",
    "httpx",
    "pyyaml",
    "boto3",
    "python-dotenv",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "pip-audit",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = [
    "harness*",
    "metrics*",
    "safety*",
    "api*",
    "jobs*",
    "store*",
    "config*",
    "calibration*",
    "ci*",
    "data*",
]


[tool.coverage.run]
source = ["harness", "metrics", "safety", "api", "jobs", "store", "config"]
