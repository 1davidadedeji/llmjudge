# Per-repo merge-gate thresholds. A repo merges only when its blended eval
# score (mean of gated metrics) meets or exceeds its threshold.
default_threshold: 0.75
# Repos without an entry inherit default_threshold.
repos:
  retrieval-core:
    threshold: 0.80

  agentflow:
    threshold: 0.79

  graphmind:
    threshold: 0.77

  llmjudge:
    threshold: 0.83

  shipwright:
    threshold: 0.86
