name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1,4"

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit pyyaml cyclonedx-bom
      - run: pip install .
      - run: cyclonedx-py environment -o sbom.json || true
      - run: pip freeze | grep -v llmjudge > /tmp/reqs.txt
      - run: pip-audit --strict -r /tmp/reqs.txt --output json > audit.json || true
      - run: python ci/audit_filter.py --check audit.json

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --prefix dashboard
      - run: npm audit --prefix dashboard --audit-level=moderate

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python -c "import yaml,glob; [yaml.safe_load(open(p)) for p in glob.glob('ci/*.yaml')]"
