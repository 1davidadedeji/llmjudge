default_dataset: gold-v1
repos:
  - repo: retrieval-core
    dataset: retrieval-gold-v3
    metrics:
      - name: faithfulness
      - name: contextual_precision
      - name: contextual_recall
  - repo: agentflow
    dataset: agent-trajectories-v2
    metrics:
      - name: agent_trajectory
      - name: faithfulness

  - repo: graphmind
    dataset: graphmind-gold-v1
    metrics:
      - name: faithfulness
      - name: hallucination

  - repo: llmjudge
    dataset: self-eval-gold-v1
    metrics:
      - name: faithfulness
      - name: answer_relevancy

  - repo: shipwright
    dataset: shipwright-gold-v2
    metrics:
      - name: faithfulness
      - name: hallucination
      - name: g_eval
        threshold: 0.8
